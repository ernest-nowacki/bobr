name: CI

on:
  push:
    branches: ["main"]
  pull_request:
    types: [opened, synchronize]

jobs:
  e2e:
    name: E2E Tests
    timeout-minutes: 60
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: .
    env:
      NEXT_PUBLIC_BOBR_WEB_URL: http://localhost:3000
      NEXT_PUBLIC_BOBR_DOCS_URL: http://localhost:3001

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup pnpm
        uses: pnpm/action-setup@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: "pnpm"

      - name: Derive SHAs for Nx
        uses: nrwl/nx-set-shas@v4

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Install Playwright Browsers
        run: pnpm --filter @repo/web-e2e exec playwright install --with-deps

      - name: Build affected projects
        run: pnpm exec nx affected -t build --base="$NX_BASE" --head="$NX_HEAD" --output-style=stream

      - name: Sync build hashes
        run: pnpm exec tsx scripts/hash-build.ts

      - name: Run affected E2E tests
        run: pnpm exec nx affected -t e2e:test --base="$NX_BASE" --head="$NX_HEAD" --output-style=stream
